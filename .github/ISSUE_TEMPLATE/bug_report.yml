name: Ошибка
description: Сообщить о воспроизводимой проблеме
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    attributes:
      label: Что произошло?
      description: Опишите фактическое и ожидаемое поведение.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Как воспроизвести?
      placeholder: "1. Запустить…\n2. Выбрать…\n3. Увидеть…"
    validations:
      required: true
  - type: input
    attributes:
      label: Версия Windows
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: input
    attributes:
      label: Модель и видеокарта
      placeholder: small, NVIDIA RTX 3060
